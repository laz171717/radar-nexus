name: Actualizar radar

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recolectar tendencias
        run: python recolector.py
      - name: Guardar caché de traducciones
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json cache_traducciones.json
          git diff --cached --quiet || git commit -m "Datos $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase -X theirs || true
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: publicar
        uses: actions/deploy-pages@v4
