name: Actualizar radar

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publicar1.outputs.page_url || steps.publicar2.outputs.page_url || steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recolectar tendencias
        run: python recolector.py
      - name: Guardar caché de traducciones
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json cache_traducciones.json
          git diff --cached --quiet || git commit -m "Datos $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase -X theirs || true
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      # GitHub a veces falla al publicar («No artifacts named github-pages», «try again later»):
      # se reintenta hasta 2 veces más tras esperar, para que la página no se quede con datos viejos
      - id: publicar1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.publicar1.outcome == 'failure'
        run: sleep 45
      - id: publicar2
        if: steps.publicar1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.publicar1.outcome == 'failure' && steps.publicar2.outcome == 'failure'
        run: sleep 90
      - id: publicar
        if: steps.publicar1.outcome == 'failure' && steps.publicar2.outcome == 'failure'
        uses: actions/deploy-pages@v4
